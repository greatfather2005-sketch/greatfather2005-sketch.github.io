name: One-time approved history privacy cleanup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Remove only the retired embedded PDF catalog from history
        shell: bash
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          test "$(git hash-object index.html)" = 74a37965fe1fb74a51948cecd45c5505792b0f4c
          test "$(git hash-object 1-badge.jpg)" = beab51948d2d66d922f6b4bdf9d574272b6c2545
          test "$(git hash-object 1-logo-transparent.png)" = 0134aff5930a32d7046d8594381c914cadda8a96
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch --force --tree-filter 'if [ -f index.html ]; then sed -i "s/^const PDFS = .*/const PDFS = [];/" index.html; fi' -- main
          git diff --exit-code "$before" HEAD -- index.html 1-badge.jpg 1-logo-transparent.png
          python3 - <<'PY'
          import subprocess
          for commit in subprocess.check_output(['git','rev-list','main']).decode().split():
              p = subprocess.run(['git','show',commit+':index.html'],capture_output=True)
              for line in p.stdout.splitlines():
                  if line.startswith(b'const PDFS = ') and line != b'const PDFS = [];':
                      raise SystemExit('Retired embedded catalog remains')
          print('All reachable main history checked; no embedded catalog remains; current site files unchanged.')
          PY
          git push --force-with-lease="refs/heads/main:$before" origin HEAD:main
